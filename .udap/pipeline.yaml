version: 1
name: vault
vcs: github

stages:
  - id: provision
    kind: provision
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_my_ip: ${{ secrets.MY_IP }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve
      - name: Get Outputs
        id: tf_outputs
        working-directory: infra
        run: |
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
    outputs:
      instance_ip: ${{ steps.tf_outputs.outputs.instance_ip }}
      instance_id: ${{ steps.tf_outputs.outputs.instance_id }}

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 25
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_my_ip: ${{ secrets.MY_IP }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Read instance ID from state
        id: tf_out
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Install Ansible and AWS SSM dependencies
        run: |
          pip install ansible-core boto3 botocore
          ansible-galaxy collection install community.aws amazon.aws
      - name: Install AWS Session Manager plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb
      - name: Wait for SSM agent to register
        run: |
          INSTANCE_ID="${{ steps.tf_out.outputs.instance_id }}"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is Online after $i attempt(s)"
              exit 0
            fi
            echo "Attempt $i: SSM status=$STATUS, waiting 15s..."
            sleep 15
          done
          echo "ERROR: SSM agent never came online for $INSTANCE_ID"
          exit 1
      - name: Generate SSM inventory
        run: |
          INSTANCE_ID="${{ steps.tf_out.outputs.instance_id }}"
          cat > /tmp/inventory.ini <<EOF
          [vault]
          $INSTANCE_ID

          [vault:vars]
          ansible_connection=community.aws.aws_ssm
          ansible_aws_ssm_bucket_name=${{ secrets.TF_STATE_BUCKET }}
          ansible_aws_ssm_region=us-east-1
          ansible_python_interpreter=/usr/bin/python3
          ansible_remote_tmp=/tmp/.ansible-ssm
          EOF
      - name: Run Ansible playbook via SSM
        run: ansible-playbook -i /tmp/inventory.ini ansible/site.yml

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_my_ip: ${{ secrets.MY_IP }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Read instance IP from state
        id: tf_ip
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
      - name: Wait for Vault to be reachable
        run: |
          curl --fail \
            --retry 15 \
            --retry-delay 15 \
            --retry-all-errors \
            "http://${{ steps.tf_ip.outputs.instance_ip }}:8200/v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200"
      - name: Print Vault UI URL
        run: echo "Vault UI -> http://${{ steps.tf_ip.outputs.instance_ip }}:8200/ui"

rollback:
  strategy: manual
